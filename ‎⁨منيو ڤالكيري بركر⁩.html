<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>منيو ڤالكيري بركر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: brown brand band with logo, sticky brown category bar, one menu column, sticky orange cart bar opening an order sheet. */
:root{
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --bg:#fbf7f1;
  --surface:#ffffff;
  --fg:#2a1a13;
  --muted:#6e5a50;
  --line:#eadfd4;
  --chip:#f3e8dc;
  --accent:#f57c1f;
  --accent-fg:#2a1409;
  --accent-text:#b34700;
  --brand:#49291c;
  --brand-fg:#fff1de;
  --warn:#b42318;
  --font-display:'Reem Kufi','Tajawal',Tahoma,sans-serif;
  --font-body:'Tajawal',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a0f0b;--surface:#281812;--fg:#f6ece3;--muted:#b8a597;--line:#3b2820;--chip:#33211a;
    --accent:#ff8a2b;--accent-fg:#2a1409;--accent-text:#ffa05a;--warn:#ff8a7a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a0f0b;--surface:#281812;--fg:#f6ece3;--muted:#b8a597;--line:#3b2820;--chip:#33211a;
  --accent:#ff8a2b;--accent-fg:#2a1409;--accent-text:#ffa05a;--warn:#ff8a7a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;
  direction:rtl;
  padding-block:0 6rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:640px;margin-inline:auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.band{margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr);background:var(--brand);color:var(--brand-fg)}

.hero{padding-block:1rem .75rem}
.hero-in{max-width:640px;margin-inline:auto;display:flex;align-items:center;gap:1rem}
.logo{width:112px;height:auto;flex:none;display:block}
.hero h1{font-family:var(--font-display);font-size:2rem;line-height:1.2;margin:0;font-weight:700;color:var(--accent);text-wrap:balance}
.hero p{margin:.15rem 0 0;font-size:.9rem;opacity:.9}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;padding-block:.5rem;border-bottom:2px solid var(--accent)}
.nav-in{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;max-width:640px;margin-inline:auto}
.nav-in::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:rgba(255,241,222,.14);color:var(--brand-fg);border-radius:999px;padding:.4rem 1rem;cursor:pointer;font-weight:500}
.chip:hover{background:rgba(255,241,222,.26)}

.cat{padding-top:1.5rem;scroll-margin-top:calc(60px + env(safe-area-inset-top,0px))}
.cat h2{font-family:var(--font-display);font-size:1.35rem;margin:0;font-weight:600}
.catnote{margin:0 0 .5rem;color:var(--muted);font-size:.875rem}
.cat h2 + .items{margin-top:.5rem}
.items{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{padding:.85rem 1rem}
.item + .item{border-top:1px solid var(--line)}
.item.single{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.75rem;align-items:center}
.item h3{font-size:1rem;margin:0;font-weight:700}
.item .desc{margin:0;color:var(--muted);font-size:.875rem}
.price{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent-text)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-top:.5rem}
.opt + .opt{padding-top:.5rem;border-top:1px dashed var(--line)}
.olabel{color:var(--muted);font-size:.9rem;margin-inline-end:.5rem}
.add{border:0;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:.4rem 1.1rem;font-weight:700;cursor:pointer;min-height:40px}
.step{display:flex;align-items:center;gap:.25rem}
.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.25rem;cursor:pointer;line-height:1}
.step button.plus{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.step span{min-width:1.75rem;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

.bar{position:fixed;inset:auto 0 0 0;z-index:8;padding-top:.6rem;padding-bottom:calc(.6rem + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar-in{max-width:640px;margin-inline:auto}
.open{width:100%;display:flex;justify-content:space-between;align-items:center;gap:1rem;border:0;background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:.8rem 1rem;font-weight:700;font-size:1.05rem;cursor:pointer}
.open .tot{font-variant-numeric:tabular-nums}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:21;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding-top:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:1rem}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-family:var(--font-display);margin:0;font-size:1.35rem}
.close{border:0;background:var(--chip);width:40px;height:40px;border-radius:50%;font-size:1.25rem;cursor:pointer}
.lines{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center;padding:.7rem 1rem}
.line + .line{border-top:1px solid var(--line)}
.line b{display:block}
.line small{color:var(--muted);font-variant-numeric:tabular-nums}
.sum{display:flex;flex-direction:column;gap:.25rem;padding:.25rem}
.sum div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.sum .grand{font-weight:700;font-size:1.15rem;border-top:1px solid var(--line);padding-top:.5rem;margin-top:.25rem}
.field{display:flex;flex-direction:column;gap:.25rem}
.field label{font-weight:500;font-size:.9rem}
.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .75rem;font-size:16px;width:100%}
.field textarea{resize:vertical;min-height:4.5rem}
.err{color:var(--warn);min-height:1.4em;margin:0;font-size:.9rem}
.send{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:.85rem 1rem;font-weight:700;font-size:1.05rem}
.hint{color:var(--muted);font-size:.85rem;margin:0;text-align:center}
@media (prefers-reduced-motion:no-preference){.chip,.add,.open{transition:background .15s}}
</style>

  ]},
  { cat: 'سندويش', meal: true, items: [

    { id: 's2', name: 'تويستر', price: 5000 },
    { id: 's3', name: 'بركر دجاج', price: 4000 },
    { id: 's4', name: 'زنجر', price: 5000 },
    { id: 's5', name: 'دبل زنجر', price: 7000 },
    { id: 's6', name: 'سوبريم', price: 6000 },
    { id: 's7', name: 'فيلي تشيز ستيك', price: 5000 },
    { id: 's8', name: 'تكساس تشكن فاهيتا', price: 4500 },
    { id: 's9', name: 'صاج لحم', price: 4500 },
    { id: 's10', name: 'صاج دجاج', price: 4000 }
  ]},
  { cat: 'ريزو', items: [

  { cat: 'دجاج كنتاكي', items: [

  ]},
  { cat: 'أجنحة وستربس', items: [

    { id: 'k6', name: 'ستربس 4 قطع', desc: 'فلر بوكس', price: 7500 },
    { id: 'k7', name: 'ستربس 6 قطع', desc: 'فلر بوكس', price: 10000 }
  ]},
  { cat: 'سلطات ومشروبات', items: [
    { id: 'x1', name: 'سلطة سيزر', price: 4500 },

];

var cart = {};
var byKey = {};
MENU.forEach(function(c){
  c.items.forEach(function(i){
    byKey[i.id] = { name: i.name, price: i.price };
    if (c.meal) byKey[i.id + '_m'] = { name: i.name + ' (وجبة)', price: i.price + CONFIG.meal };
  });
});

function fmt(n){ return n.toLocaleString('en-US') + ' ' + CONFIG.currency; }
function $(id){ return document.getElementById(id); }

function totals(){
  var count = 0, sub = 0;
  Object.keys(cart).forEach(function(k){ count += cart[k]; sub += cart[k] * byKey[k].price; });
  var delivery = count ? CONFIG.delivery : 0;
  return { count: count, sub: sub, delivery: delivery, total: sub + delivery };
}

function stepper(k){
  return '<div class="step"><button type="button" data-act="inc" data-id="'+k+'" class="plus" aria-label="زيادة">+</button>' +
    '<span>'+cart[k]+'</span>' +
    '<button type="button" data-act="dec" data-id="'+k+'" aria-label="نقصان">&minus;</button></div>';
}
function ctl(k){
  return cart[k] ? stepper(k) : '<button class="add" type="button" data-act="inc" data-id="'+k+'">أضف</button>';
}

function renderMenu(){
  var nav = '', html = '';
  MENU.forEach(function(c, ci){
    nav += '<button class="chip" type="button" data-go="cat'+ci+'">'+c.cat+'</button>';
    html += '<section class="cat" id="cat'+ci+'"><h2>'+c.cat+'</h2>';
    if (c.meal) html += '<p class="catnote">تقدر تحوله وجبة بإضافة '+fmt(CONFIG.meal)+'</p>';
    html += '<div class="items">';
    c.items.forEach(function(i){
      var desc = i.desc ? '<p class="desc">'+i.desc+'</p>' : '';
      if (!c.meal){
        html += '<div class="item single"><div><h3>'+i.name+'</h3>'+desc+'<div class="price">'+fmt(i.price)+'</div></div>'+ctl(i.id)+'</div>';
      } else {
        html += '<div class="item"><h3>'+i.name+'</h3>'+desc +
          '<div class="opt"><div><span class="olabel">عادي</span><span class="price">'+fmt(i.price)+'</span></div>'+ctl(i.id)+'</div>' +
          '<div class="opt"><div><span class="olabel">وجبة</span><span class="price">'+fmt(i.price + CONFIG.meal)+'</span></div>'+ctl(i.id+'_m')+'</div></div>';
      }
    });
    html += '</div></section>';
  });
  $('nav').innerHTML = nav;
  $('menu').innerHTML = html;
}

function renderCart(){
  var t = totals(), l = '';
  Object.keys(cart).forEach(function(k){
    var i = byKey[k];
    l += '<div class="line"><div><b>'+i.name+'</b><small>'+fmt(i.price)+' × '+cart[k]+' = '+fmt(i.price*cart[k])+'</small></div>'+stepper(k)+'</div>';
  });
  $('lines').innerHTML = l;
  $('sum').innerHTML = '<div><span>المجموع</span><span>'+fmt(t.sub)+'</span></div>' +
    '<div><span>التوصيل</span><span>'+fmt(t.delivery)+'</span></div>' +
    '<div class="grand"><span>الإجمالي</span><span>'+fmt(t.total)+'</span></div>';
  $('bar').hidden = t.count === 0;
  $('barCount').textContent = t.count + (t.count === 1 ? ' صنف' : ' أصناف');
  $('barTotal').textContent = fmt(t.total);
  if (t.count === 0) closeSheet();
}

function render(focusSel){
  renderMenu(); renderCart();
  if (focusSel){ var el = document.querySelector(focusSel); if (el) el.focus(); }
}

function change(k, d){
  var q = (cart[k] || 0) + d;
  if (q <= 0) delete cart[k]; else cart[k] = q;
}

function onAct(e){
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var k = b.getAttribute('data-id'), act = b.getAttribute('data-act');
  change(k, act === 'inc' ? 1 : -1);
  render('[data-id="'+k+'"][data-act="'+(cart[k] ? act : 'inc')+'"]');
  updateLink();
}
$('menu').addEventListener('click', onAct);
$('lines').addEventListener('click', onAct);

$('nav').addEventListener('click', function(e){
  var b = e.target.closest('[data-go]');
  if (b) $(b.getAttribute('data-go')).scrollIntoView({ behavior: 'smooth', block: 'start' });
});

function openSheet(){ $('scrim').hidden = false; $('sheet').hidden = false; $('closeCart').focus(); }
function closeSheet(){ $('scrim').hidden = true; $('sheet').hidden = true; }
$('openCart').addEventListener('click', openSheet);
$('closeCart').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });

function buildMessage(){
  var t = totals(), m = 'طلب جديد من ' + CONFIG.name + '\n\n';
  Object.keys(cart).forEach(function(k){
    var i = byKey[k];
    m += '• ' + cart[k] + '× ' + i.name + ' — ' + fmt(i.price * cart[k]) + '\n';
  });
  m += '\nالمجموع: ' + fmt(t.sub) + '\nالتوصيل: ' + fmt(t.delivery) + '\nالإجمالي: ' + fmt(t.total) + '\n';
  m += '\nالاسم: ' + $('cName').value.trim();
  m += '\nالموبايل: ' + $('cPhone').value.trim();
  m += '\nالعنوان: ' + $('cAddr').value.trim();
  var n = $('cNote').value.trim();
  if (n) m += '\nملاحظات: ' + n;
  return m;
}

function updateLink(){
  var base = 'https://wa.me/' + CONFIG.whatsapp.replace(/\D/g, '');
  $('send').href = base + '?text=' + encodeURIComponent(buildMessage());
}
['cName','cPhone','cAddr','cNote'].forEach(function(id){ $(id).addEventListener('input', updateLink); });

$('send').addEventListener('click', function(e){
  var msg = '';
  if (!totals().count) msg = 'أضف صنف واحد على الأقل.';
  else if (!$('cName').value.trim()) msg = 'اكتب اسمك.';
  else if (!$('cPhone').value.trim()) msg = 'اكتب رقم الموبايل.';
  else if (!$('cAddr').value.trim()) msg = 'اكتب عنوان التوصيل.';
  $('err').textContent = msg;
  if (msg) { e.preventDefault(); return; }
  updateLink();
});

$('rname').textContent = CONFIG.name;
$('info').textContent = 'التوصيل ' + fmt(CONFIG.delivery) + ' · الطلب عبر واتساب';
render();
updateLink();
$('nav').scrollLeft = 0;
</script>
